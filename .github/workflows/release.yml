name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.repository.pushed_at }}
        run: |
          MODULE=github.com/arturbaumann/monvif
          LDFLAGS="-X ${MODULE}/cmd.version=${VERSION} -X ${MODULE}/cmd.commit=${COMMIT:0:7} -X ${MODULE}/cmd.date=${DATE}"
          mkdir -p dist
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              echo "Building ${GOOS}/${GOARCH}..."
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o dist/monvif-${GOOS}-${GOARCH} .
              tar -czf dist/monvif-${VERSION}-${GOOS}-${GOARCH}.tar.gz \
                -C dist monvif-${GOOS}-${GOARCH} \
                -C .. README.md LICENSE
              rm dist/monvif-${GOOS}-${GOARCH}
            done
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ github.ref_name }}
          gh release create "${VERSION}" dist/*.tar.gz \
            --title "monvif ${VERSION}" \
            --generate-notes
